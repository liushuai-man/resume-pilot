name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/liushuai-man/resume-pilot-backend
  FRONTEND_IMAGE: ghcr.io/liushuai-man/resume-pilot-frontend

jobs:
  build:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            image: ghcr.io/liushuai-man/resume-pilot-backend
            dockerfile: docker/backend.Dockerfile
            cache_scope: backend
            build_args: ""
          - service: frontend
            image: ghcr.io/liushuai-man/resume-pilot-frontend
            dockerfile: docker/frontend.Dockerfile
            cache_scope: frontend
            build_args: VITE_API_BASE_URL=

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
          provenance: false
          sbom: false

  deploy:
    name: Deploy on ECS
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out deployment files
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            docker-compose.production.yml
            docker/deploy.sh
          sparse-checkout-cone-mode: false

      - name: Configure deployment SSH key
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_PORT: ${{ secrets.ECS_PORT }}
          ECS_SSH_PRIVATE_KEY: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
        run: |
          test -n "$ECS_HOST"
          test -n "$ECS_PORT"
          test -n "$ECS_SSH_PRIVATE_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ECS_SSH_PRIVATE_KEY" > ~/.ssh/resumepilot_deploy
          chmod 600 ~/.ssh/resumepilot_deploy
          ssh-keyscan -p "$ECS_PORT" -H "$ECS_HOST" >> ~/.ssh/known_hosts

      - name: Upload production deployment files
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_PORT: ${{ secrets.ECS_PORT }}
          ECS_USER: ${{ secrets.ECS_USER }}
        run: |
          ssh -i ~/.ssh/resumepilot_deploy -p "$ECS_PORT" "$ECS_USER@$ECS_HOST" "mkdir -p /root/resume-pilot/docker"
          scp -i ~/.ssh/resumepilot_deploy -P "$ECS_PORT" docker-compose.production.yml "$ECS_USER@$ECS_HOST:/root/resume-pilot/docker-compose.production.yml"
          scp -i ~/.ssh/resumepilot_deploy -P "$ECS_PORT" docker/deploy.sh "$ECS_USER@$ECS_HOST:/root/resume-pilot/docker/deploy.sh"

      - name: Log ECS in to GitHub Container Registry
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_PORT: ${{ secrets.ECS_PORT }}
          ECS_USER: ${{ secrets.ECS_USER }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/resumepilot_deploy -p "$ECS_PORT" "$ECS_USER@$ECS_HOST" "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

      - name: Deploy application on ECS
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_PORT: ${{ secrets.ECS_PORT }}
          ECS_USER: ${{ secrets.ECS_USER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/resumepilot_deploy -p "$ECS_PORT" "$ECS_USER@$ECS_HOST" "IMAGE_TAG='$IMAGE_TAG' PROJECT_DIR=/root/resume-pilot sh /root/resume-pilot/docker/deploy.sh"
