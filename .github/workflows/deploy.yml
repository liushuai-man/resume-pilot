name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/liushuai-man/resume-pilot-backend
  FRONTEND_IMAGE: ghcr.io/liushuai-man/resume-pilot-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Configure deployment SSH key
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_PORT: ${{ secrets.ECS_PORT }}
          ECS_SSH_PRIVATE_KEY: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
        run: |
          test -n "$ECS_HOST"
          test -n "$ECS_PORT"
          test -n "$ECS_SSH_PRIVATE_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ECS_SSH_PRIVATE_KEY" > ~/.ssh/resumepilot_deploy
          chmod 600 ~/.ssh/resumepilot_deploy
          ssh-keyscan -p "$ECS_PORT" -H "$ECS_HOST" >> ~/.ssh/known_hosts

      - name: Upload production deployment files
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_PORT: ${{ secrets.ECS_PORT }}
          ECS_USER: ${{ secrets.ECS_USER }}
        run: |
          ssh -i ~/.ssh/resumepilot_deploy -p "$ECS_PORT" "$ECS_USER@$ECS_HOST" "mkdir -p /root/resume-pilot/docker"
          scp -i ~/.ssh/resumepilot_deploy -P "$ECS_PORT" docker-compose.production.yml "$ECS_USER@$ECS_HOST:/root/resume-pilot/docker-compose.production.yml"
          scp -i ~/.ssh/resumepilot_deploy -P "$ECS_PORT" docker/deploy.sh "$ECS_USER@$ECS_HOST:/root/resume-pilot/docker/deploy.sh"

      - name: Log ECS in to GitHub Container Registry
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_PORT: ${{ secrets.ECS_PORT }}
          ECS_USER: ${{ secrets.ECS_USER }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/resumepilot_deploy -p "$ECS_PORT" "$ECS_USER@$ECS_HOST" "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

      - name: Deploy on ECS
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_PORT: ${{ secrets.ECS_PORT }}
          ECS_USER: ${{ secrets.ECS_USER }}
        run: |
          ssh -i ~/.ssh/resumepilot_deploy -p "$ECS_PORT" "$ECS_USER@$ECS_HOST" "PROJECT_DIR=/root/resume-pilot sh /root/resume-pilot/docker/deploy.sh"
