  db:
    image: pgvector/pgvector:pg17
    container_name: resume-pilot-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: resume_pilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  
  redis:
    image: redis:8
    container_name: resume-pilot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

