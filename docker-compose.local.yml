services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${LOCAL_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?set LOCAL_POSTGRES_PASSWORD to the password in backend/.env DATABASE_URL}
      POSTGRES_DB: ${LOCAL_POSTGRES_DB:-resume_pilot}
    ports:
      - "${LOCAL_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    ports:
      - "${LOCAL_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_local_data:/data
    restart: unless-stopped

volumes:
  postgres_local_data:
  redis_local_data:
